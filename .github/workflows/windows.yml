name: Windows release build
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-2022
    strategy:
      matrix:
        configuration: [Debug, Release]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Set up portable MinGW
        shell: pwsh
        run: |
          $irforgeArchive=Join-Path $env:RUNNER_TEMP 'w64devkit-x64-2.6.0.7z.exe'
          Invoke-WebRequest 'https://github.com/skeeto/w64devkit/releases/download/v2.6.0/w64devkit-x64-2.6.0.7z.exe' -OutFile $irforgeArchive
          $irforgeHash=(Get-FileHash -LiteralPath $irforgeArchive -Algorithm SHA256).Hash
          if($irforgeHash -ne 'bb212f0012a9324b8cf4104a76c07199d9c17607b4c5755632108d0432359beb') {throw 'Toolchain checksum mismatch'}
          $irforgeToolchain=Join-Path $env:RUNNER_TEMP 'irforge-toolchain'
          7z x $irforgeArchive "-o$irforgeToolchain" -y
          if($LASTEXITCODE) {throw 'Toolchain extraction failed'}
          $irforgeBin=Join-Path $irforgeToolchain 'w64devkit/bin'
          if(!(Test-Path -LiteralPath (Join-Path $irforgeBin 'g++.exe'))) {throw 'Extracted compiler missing'}
          $irforgeBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Build production applications
        shell: pwsh
        run: ./scripts/build.ps1 -Configuration ${{ matrix.configuration }}
      - name: Check owned-source formatting
        shell: pwsh
        run: |
          $irforgeFiles=Get-ChildItem src,include -Recurse -File | Where-Object {$_.Extension -in '.cpp','.hpp'} | ForEach-Object {$_.FullName}
          & build/dependencies/clang-format/clang_format/data/bin/clang-format.exe --dry-run --Werror @irforgeFiles
          if($LASTEXITCODE){throw 'Formatting check failed'}
      - name: Verify application entry points and shipped rules
        shell: pwsh
        run: |
          $irforgeBuild=if('${{ matrix.configuration }}' -eq 'Debug'){'build/mingw-debug'}else{'build/mingw'}
          & "$irforgeBuild/irforge.exe" version
          if($LASTEXITCODE){throw 'Agent failed'}
          & "$irforgeBuild/irforge.exe" rules validate --dir rules/internal
          if($LASTEXITCODE){throw 'Rule validation failed'}
          & "$irforgeBuild/irforge_collector.exe" --help
          if($LASTEXITCODE){throw 'Collector failed'}
      - name: Produce ZIP and MSI without installing
        if: matrix.configuration == 'Release'
        shell: pwsh
        run: |
          ./scripts/bootstrap.ps1 -Installer
          python scripts/yara-license-audit.py
          ./scripts/package.ps1 -Version 1.0.0-dev
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: matrix.configuration == 'Release' && success()
        with:
          name: irforge-preview-windows-x64
          path: |
            dist/*.zip
            dist/*.msi
            dist/*.tar.xz
            dist/SHA256SUMS.txt
